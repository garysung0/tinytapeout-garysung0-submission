# Tiny Tapeout project information
project:
  title: "Mixed-Signal Evaluation ASIC"
  author: "Gary Sung"
  discord: "garysung"
  description: "Custom mixed-signal ASIC with analog characterization structures, digital control interface, and SPI slave. Fabricated on SkyWater Sky130A 130 nm CMOS."
  language: "Mixed-Signal"
  clock_hz: 50000000

  tiles: "1x2"

  analog_pins: 8
  uses_vapwr: false

  top_module: "tt_um_garysung0_vdac"

  source_files:
    - src/tt_um_garysung0_vdac_synth.v

pinout:
  ui[0]: "spi_clk"
  ui[1]: "spi_mosi"
  ui[2]: "spi_cs_b"
  ui[3]: "rst_n"
  ui[4]: "mode_sel"
  ui[5]: "aux_en_0"
  ui[6]: "aux_en_1"
  ui[7]: "aux_en_2"

  uo[0]: "spi_miso"
  uo[1]: "status_0"
  uo[2]: "status_1"
  uo[3]: "clk_div"
  uo[4]: "trig_0"
  uo[5]: "fault_0"
  uo[6]: "status_2"
  uo[7]: "status_3"

  uio[0]: "aux_data_0"
  uio[1]: "aux_data_1"
  uio[2]: "aux_data_2"
  uio[3]: "flag_0"
  uio[4]: "flag_1"
  uio[5]: "flag_2"
  uio[6]: "flag_3"
  uio[7]: "flag_4"

  ua[0]: "aout_0"
  ua[1]: "aout_1"
  ua[2]: "aout_2"
  ua[3]: "aout_3"
  ua[4]: "aio_0"
  ua[5]: "aio_1"
  ua[6]: "aio_2"
  ua[7]: "aio_3"

yaml_version: 6
